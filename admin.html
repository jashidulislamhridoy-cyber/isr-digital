<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Recent Work Dashboard | ISR Digital Marketing</title>
<style>
  :root { --bg:#0b0b0c; --panel:#141416; --line:#2a2a2e; --text:#f4f4f5; --muted:#9a9aa3; --gold:#d4af37; --bad:#ff6b6b; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:Inter, system-ui, sans-serif; background:var(--bg); color:var(--text); }
  header { padding:18px 26px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; }
  h1 { font-size:19px; margin:0; } h1 span { color:var(--gold); }
  main { max-width:1100px; margin:0 auto; padding:22px 26px 60px; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:20px; }
  .login { max-width:360px; margin:60px auto; }
  h2 { font-size:14px; margin:0 0 12px; color:var(--gold); text-transform:uppercase; letter-spacing:.06em; }
  label { display:block; font-size:12px; color:var(--muted); margin:12px 0 6px; }
  input[type=text], input[type=email], input[type=password], input[type=url] { width:100%; padding:10px 12px; background:var(--bg); border:1px solid var(--line); border-radius:8px; color:var(--text); font:inherit; }
  input[type=file] { color:var(--muted); font-size:13px; }
  .btn { background:var(--gold); color:#000; border:0; padding:11px 16px; border-radius:8px; font:inherit; font-weight:600; cursor:pointer; margin-top:14px; width:100%; }
  .btn:disabled { opacity:.4; cursor:not-allowed; }
  .btn.ghost { background:transparent; color:var(--text); border:1px solid var(--line); width:auto; margin:0; padding:8px 14px; }
  .tabs { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:18px; }
  .tab { background:transparent; color:var(--muted); border:1px solid var(--line); padding:8px 15px; border-radius:999px; cursor:pointer; font:inherit; }
  .tab.active { color:#000; background:var(--gold); border-color:var(--gold); font-weight:600; }
  .grid { display:grid; grid-template-columns:320px 1fr; gap:22px; }
  @media (max-width:820px){ .grid{ grid-template-columns:1fr; } }
  .item { display:flex; gap:14px; padding:12px; border:1px solid var(--line); border-radius:10px; margin-bottom:10px; align-items:center; }
  .item img { width:140px; height:84px; object-fit:cover; border-radius:6px; background:#000; flex-shrink:0; }
  .item .info { flex:1; min-width:0; }
  .item .info b { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .item .info span { font-size:13px; color:var(--muted); }
  .acts { display:flex; flex-direction:column; gap:6px; }
  .mini { background:transparent; border:1px solid var(--line); color:var(--text); border-radius:6px; padding:5px 9px; font:inherit; font-size:12px; cursor:pointer; }
  .mini.del { color:var(--bad); }
  .msg { font-size:13px; margin-top:10px; color:var(--muted); }
  .msg.bad { color:var(--bad); }
  .empty { color:var(--muted); font-size:14px; padding:24px 0; text-align:center; }
  .top { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
</style>
</head>
<body>
<header>
  <h1>Recent Work <span>Dashboard</span></h1>
  <div id="whoBox" style="display:none;align-items:center;gap:10px">
    <span id="who" style="font-size:13px;color:var(--muted)"></span>
    <button class="btn ghost" id="logoutBtn" type="button">Log out</button>
  </div>
</header>
<main>
  <section id="loginView" class="panel login" style="display:none">
    <h2>Log in</h2>
    <label for="email">Email</label>
    <input type="email" id="email" autocomplete="username">
    <label for="password">Password</label>
    <input type="password" id="password" autocomplete="current-password">
    <button class="btn" id="loginBtn" type="button">Log in</button>
    <div class="msg" id="loginMsg"></div>
  </section>

  <section id="appView" style="display:none">
    <div class="tabs" id="tabs"></div>
    <div class="grid">
      <section class="panel">
        <h2>Add item</h2>
        <label for="file">Image (required)</label>
        <input type="file" id="file" accept="image/*">
        <label for="title">Title (required)</label>
        <input type="text" id="title">
        <label for="client">Client / brand</label>
        <input type="text" id="client">
        <label for="metric">Result (optional)</label>
        <input type="text" id="metric" placeholder="e.g. +320% views">
        <label for="link">Link (optional)</label>
        <input type="url" id="link" placeholder="https://">
        <button class="btn" id="addBtn" type="button" disabled>Add</button>
        <div class="msg" id="addMsg"></div>
      </section>
      <section class="panel">
        <div class="top"><h2 id="listTitle">Items</h2></div>
        <div id="list"></div>
      </section>
    </div>
  </section>
    <section class="panel" style="margin-top:22px">
      <h2>Social media links</h2>
      <p class="msg" style="margin:0 0 6px">Paste the full link. Leave empty to hide that icon on the website.</p>
      <label for="s_facebook">Facebook</label><input type="url" id="s_facebook" placeholder="https://facebook.com/...">
      <label for="s_instagram">Instagram</label><input type="url" id="s_instagram" placeholder="https://instagram.com/...">
      <label for="s_youtube">YouTube</label><input type="url" id="s_youtube" placeholder="https://youtube.com/...">
      <label for="s_linkedin">LinkedIn</label><input type="url" id="s_linkedin" placeholder="https://linkedin.com/...">
      <button class="btn" id="saveSocial" type="button" style="width:auto;padding:11px 22px">Save links</button>
      <div class="msg" id="socialMsg"></div>
    </section>
</main>

<script src="assets/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function () {
  var PLATFORMS = ["YouTube", "Facebook", "Instagram", "Website"];
  var MAX_ITEMS = 10;
  var sb = window.supabase.createClient(window.ISR_SUPABASE.url, window.ISR_SUPABASE.key);
  var current = PLATFORMS[0];
  var items = [];
  var imageBlob = null;

  function $(id) { return document.getElementById(id); }
  function msg(id, text, bad) { var el = $(id); el.textContent = text || ""; el.className = "msg" + (bad ? " bad" : ""); }

  async function init() {
    var s = await sb.auth.getSession();
    if (s.data.session) showApp(s.data.session.user.email); else showLogin();
  }
  function showLogin() { $("loginView").style.display = "block"; $("appView").style.display = "none"; $("whoBox").style.display = "none"; }
  function showApp(email) {
    $("loginView").style.display = "none"; $("appView").style.display = "block";
    $("whoBox").style.display = "flex"; $("who").textContent = email;
    load(); loadSocial();
  }

  $("loginBtn").onclick = async function () {
    msg("loginMsg", "");
    var r = await sb.auth.signInWithPassword({ email: $("email").value.trim(), password: $("password").value });
    if (r.error) { msg("loginMsg", "Login failed. Check email and password.", true); return; }
    $("password").value = "";
    showApp(r.data.user.email);
  };
  $("logoutBtn").onclick = async function () { await sb.auth.signOut(); showLogin(); };

  async function load() {
    var r = await sb.from("portfolio_items").select("*").order("position", { ascending: true });
    if (r.error) { msg("addMsg", "Could not load items: " + r.error.message, true); return; }
    items = r.data;
    renderAll();
  }
  function forPlatform() { return items.filter(function (i) { return i.platform === current; }); }

  function renderTabs() {
    var wrap = $("tabs"); wrap.innerHTML = "";
    PLATFORMS.forEach(function (p) {
      var b = document.createElement("button");
      b.type = "button";
      b.className = "tab" + (p === current ? " active" : "");
      b.textContent = p + " (" + items.filter(function (i) { return i.platform === p; }).length + ")";
      b.onclick = function () { current = p; renderAll(); };
      wrap.appendChild(b);
    });
  }
  function renderList() {
    var list = $("list"); list.innerHTML = "";
    var mine = forPlatform();
    $("listTitle").textContent = current + " items (" + mine.length + "/" + MAX_ITEMS + ")";
    if (!mine.length) { list.innerHTML = '<div class="empty">No items yet for ' + current + ".</div>"; return; }
    mine.forEach(function (it, idx) {
      var row = document.createElement("div"); row.className = "item";
      var img = document.createElement("img"); img.src = it.image_url; img.alt = "";
      var info = document.createElement("div"); info.className = "info";
      var t = document.createElement("b"); t.textContent = it.title;
      var s = document.createElement("span"); s.textContent = [it.client, it.metric].filter(Boolean).join(" · ");
      info.appendChild(t); info.appendChild(s);
      var acts = document.createElement("div"); acts.className = "acts";
      acts.appendChild(mini("Up", idx === 0, function () { swap(mine, idx, idx - 1); }));
      acts.appendChild(mini("Down", idx === mine.length - 1, function () { swap(mine, idx, idx + 1); }));
      acts.appendChild(mini("Delete", false, function () { remove(it); }, "del"));
      row.appendChild(img); row.appendChild(info); row.appendChild(acts);
      list.appendChild(row);
    });
  }
  function mini(label, disabled, fn, cls) {
    var b = document.createElement("button");
    b.type = "button"; b.className = "mini" + (cls ? " " + cls : "");
    b.textContent = label; b.disabled = disabled; b.onclick = fn; return b;
  }
  async function swap(list, a, b) {
    var x = list[a], y = list[b];
    var px = x.position, py = y.position;
    await sb.from("portfolio_items").update({ position: py }).eq("id", x.id);
    await sb.from("portfolio_items").update({ position: px }).eq("id", y.id);
    load();
  }
  async function remove(it) {
    if (!confirm("Delete this item?")) return;
    var r = await sb.from("portfolio_items").delete().eq("id", it.id);
    if (r.error) { alert("Delete failed: " + r.error.message); return; }
    load();
  }
  function renderAll() { renderTabs(); renderList(); updateAdd(); }
  function updateAdd() {
    $("addBtn").disabled = !(imageBlob && $("title").value.trim() && forPlatform().length < MAX_ITEMS);
    if (forPlatform().length >= MAX_ITEMS) msg("addMsg", current + " is full (10 items). Delete one to add more.", true);
  }

  $("file").onchange = function (e) {
    var f = e.target.files[0];
    imageBlob = null;
    if (!f) { updateAdd(); return; }
    var reader = new FileReader();
    reader.onload = function () {
      var im = new Image();
      im.onload = function () {
        var scale = Math.min(1, 1200 / im.width);
        var c = document.createElement("canvas");
        c.width = Math.round(im.width * scale); c.height = Math.round(im.height * scale);
        c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
        c.toBlob(function (blob) { imageBlob = blob; updateAdd(); }, "image/jpeg", 0.85);
      };
      im.src = reader.result;
    };
    reader.readAsDataURL(f);
  };
  $("title").oninput = updateAdd;

  $("addBtn").onclick = async function () {
    $("addBtn").disabled = true;
    msg("addMsg", "Uploading...");
    var path = current.toLowerCase() + "/" + Date.now() + ".jpg";
    var up = await sb.storage.from("portfolio").upload(path, imageBlob, { contentType: "image/jpeg" });
    if (up.error) { msg("addMsg", "Upload failed: " + up.error.message, true); updateAdd(); return; }
    var url = sb.storage.from("portfolio").getPublicUrl(path).data.publicUrl;
    var pos = forPlatform().reduce(function (m, i) { return Math.max(m, i.position); }, 0) + 1;
    var ins = await sb.from("portfolio_items").insert({
      platform: current,
      title: $("title").value.trim(),
      client: $("client").value.trim(),
      metric: $("metric").value.trim(),
      link: $("link").value.trim(),
      image_url: url,
      position: pos
    });
    if (ins.error) { msg("addMsg", "Save failed: " + ins.error.message, true); updateAdd(); return; }
    ["title", "client", "metric", "link"].forEach(function (id) { $(id).value = ""; });
    $("file").value = ""; imageBlob = null;
    msg("addMsg", "Added.");
    load();
  };


  var SOCIAL = ["facebook", "instagram", "youtube", "linkedin"];
  async function loadSocial() {
    var r = await sb.from("site_settings").select("key,value");
    if (r.error) { msg("socialMsg", "Could not load links: " + r.error.message, true); return; }
    r.data.forEach(function (row) { var el = $("s_" + row.key); if (el) el.value = row.value || ""; });
  }
  $("saveSocial").onclick = async function () {
    var rows = SOCIAL.map(function (k) { return { key: k, value: $("s_" + k).value.trim() }; });
    var r = await sb.from("site_settings").upsert(rows);
    msg("socialMsg", r.error ? "Save failed: " + r.error.message : "Saved. The website will show these links.", !!r.error);
  };

  sb.auth.onAuthStateChange(function (event) { if (event === "SIGNED_OUT") showLogin(); });
  init();
})();
</script>
</body>
</html>
